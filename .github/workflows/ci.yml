name: CI

on:
  pull_request:
    branches: [master]

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Changelog updated
        run: |
          git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -q "^CHANGELOG.md$" || \
          { echo "CHANGELOG.md must be updated in every PR"; exit 1; }

      - name: Changelog format
        run: |
          invalid=$(grep -E "^## \[" CHANGELOG.md | grep -v "^## \[Unreleased\]" | \
            grep -vE "^## \[[0-9]+\.[0-9]+\.[0-9]+\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" || true)
          if [ -n "$invalid" ]; then
            echo "Versioned changelog entries must follow '## [X.Y.Z] - YYYY-MM-DD':"
            echo "$invalid"
            exit 1
          fi

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Audit
        run: npm audit --audit-level=high
